name: Inspect federation identity
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    environment: lab
    runs-on: ubuntu-latest
    steps:
      - name: Show identity claims (never the token)
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          req = urllib.request.Request(url, headers={
              'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          selected = {k: claims.get(k) for k in ('sub', 'repository', 'repository_id', 'repository_owner_id', 'ref', 'aud')}
          print(json.dumps(selected, indent=2))
          PY
