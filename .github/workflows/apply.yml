name: Apply reviewed plan
on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Successful Plan cloud changes run ID (less than 24 hours old)
        required: true
        type: string
      confirmation:
        description: Type DEPLOY or DESTROY to match the reviewed plan
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: multicloud-lab-state
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == true
    environment: lab
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source run
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID" > source-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))
          required = {
              'conclusion': 'success', 'event': 'workflow_dispatch',
              'head_branch': 'main', 'head_sha': os.environ['GITHUB_SHA'],
              'path': '.github/workflows/plan.yml',
          }
          for key, value in required.items():
              if run.get(key) != value:
                  raise SystemExit(f'Source run mismatch: {key}. Generate a fresh plan from current main.')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-plan
          path: reviewed-plan
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
      - name: Verify reviewed plan
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 ci/verify-plan.py
      - uses: ./.github/actions/terraform-session
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          gcp-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Apply the saved plan
        run: terraform apply -input=false -lock-timeout=5m reviewed-plan/lab.tfplan
      - name: Show outputs
        run: terraform output
